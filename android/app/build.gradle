plugins { id 'com.android.application' }

def signingFile = rootProject.file('.signing/signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.kana.hangeoreum'
    buildFeatures { buildConfig true }
    compileSdk 36
    defaultConfig {
        applicationId 'com.kana.hangeoreum'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'com.kana.hangeoreum.KanaSmokeTest'
    }
    signingConfigs {
        if (signingFile.exists()) personal {
            storeFile rootProject.file('.signing/kana-release.jks')
            storePassword signing.getProperty('password')
            keyAlias 'kana'
            keyPassword signing.getProperty('password')
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.qa' }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.personal
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.14.0' }

// 웹 소스를 빌드마다 복사합니다. 앱과 웹에서 같은 학습 프로그램을 사용해요.
tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'style.css', 'app.js', 'daily.js', 'kana-data.js', 'audio-map.js', 'stroke-data.js', 'manifest.webmanifest', 'audio/**', 'icons/**'
        // APK는 시스템 글꼴로 오프라인 동작합니다.
        filesMatching('style.css') { filter { line -> line.startsWith('@import ') ? '' : line } }
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
tasks.register('prepareAndroidWeb', Exec) {
    dependsOn 'syncWebAssets'
    workingDir rootProject.projectDir
    commandLine 'node', 'prepare-web.mjs'
}
tasks.named('preBuild').configure { dependsOn 'prepareAndroidWeb' }
